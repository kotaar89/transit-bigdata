# Локальный стенд, повторяющий архитектуру VK Cloud:
#   Kafka            ~ VK Cloud Kafka (Managed)
#   MinIO (S3)       ~ VK Object Storage
#   Spark standalone ~ VK Cloud Spark / Data Platform
#   ClickHouse       ~ VK Cloud ClickHouse (Managed)
#   Airflow          ~ VK Cloud Airflow
#   Superset         ~ BI-витрина
name: transit

x-spark-env: &spark-env
  S3_ENDPOINT: http://minio:9000
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
  LAKE_PATH: s3a://lake
  GTFS_PATH: file:///data/gtfs
  RAW_PATH: file:///data/raw
  KAFKA_BOOTSTRAP: kafka:9092
  CLICKHOUSE_HOST: clickhouse
  CLICKHOUSE_HTTP_PORT: "8123"
  CLICKHOUSE_DB: transit
  CLICKHOUSE_USER: ${CLICKHOUSE_USER:-transit}
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-transit}

services:
  # ---------------- Хранилище ----------------
  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      retries: 10

  minio-init:
    image: cgr.dev/chainguard/minio:latest
    depends_on: { minio: { condition: service_healthy } }
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin}
      && mc mb -p local/lake && echo 'bucket lake ready'"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ports: ["8123:8123", "9009:9000"]
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-transit}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-transit}
      CLICKHOUSE_DB: transit
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      TZ: Europe/Moscow
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    ulimits: { nofile: { soft: 262144, hard: 262144 } }
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 10s
      retries: 10

  # ---------------- Потоки ----------------
  kafka:
    image: apache/kafka:3.8.0
    ports: ["29092:29092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_LOG_RETENTION_HOURS: 48
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      retries: 15

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    ports: ["8085:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: transit
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on: { kafka: { condition: service_healthy } }

  # ---------------- Генератор данных ----------------
  generator:
    build: { context: ., dockerfile: docker/generator.Dockerfile }
    image: transit/generator
    profiles: ["tools"]
    environment:
      SIM_ROUTES: ${SIM_ROUTES:-40}
      SIM_SEED: ${SIM_SEED:-42}
    volumes: [./data:/data]

  producer:
    image: transit/generator
    build: { context: ., dockerfile: docker/generator.Dockerfile }
    profiles: ["stream"]
    command: ["stream", "--bootstrap", "kafka:9092", "--speed", "${STREAM_SPEED:-30}", "--start-hour", "${STREAM_START_HOUR:-7}"]
    environment:
      SIM_ROUTES: ${SIM_ROUTES:-40}
      SIM_SEED: ${SIM_SEED:-42}
    depends_on: { kafka: { condition: service_healthy } }
    restart: on-failure

  # ---------------- Spark ----------------
  spark-master:
    build: { context: ., dockerfile: docker/spark.Dockerfile }
    image: transit/spark
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master", "--host", "spark-master"]
    ports: ["8080:8080", "7077:7077"]
    environment:
      <<: *spark-env
    volumes:
      - ./spark:/opt/transit/spark
      - ./data:/data
      - ./docker/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf

  spark-worker-1: &worker
    build: { context: ., dockerfile: docker/spark.Dockerfile }
    image: transit/spark
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077",
              "--cores", "${SPARK_WORKER_CORES:-3}", "--memory", "${SPARK_WORKER_MEMORY:-2560m}"]
    depends_on: [spark-master]
    environment:
      <<: *spark-env
    volumes:
      - ./spark:/opt/transit/spark
      - ./data:/data
      - ./docker/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf

  spark-worker-2:
    <<: *worker

  # потоковое приложение (драйвер); запускается командой `make stream`
  spark-streaming:
    build: { context: ., dockerfile: docker/spark.Dockerfile }
    image: transit/spark
    profiles: ["stream"]
    depends_on:
      kafka: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
    environment:
      <<: *spark-env
    volumes:
      - ./spark:/opt/transit/spark
      - ./data:/data
      - ./docker/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
    command: >
      spark-submit --master spark://spark-master:7077
      --conf spark.cores.max=2 --conf spark.executor.cores=1 --conf spark.executor.memory=768m
      --conf spark.driver.memory=1g --conf spark.driver.host=spark-streaming
      --conf spark.sql.streaming.statefulOperator.checkCorrectness.enabled=false
      /opt/transit/spark/jobs/stream_processing.py
    restart: on-failure

  # ---------------- Оркестрация ----------------
  airflow:
    build: { context: ., dockerfile: docker/airflow.Dockerfile }
    image: transit/airflow
    ports: ["8081:8080"]
    depends_on: [spark-master, clickhouse, minio]
    environment:
      <<: *spark-env
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "True"
      AIRFLOW__CORE__DEFAULT_TIMEZONE: Europe/Moscow
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "True"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/db/airflow.db
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_JOBS: /opt/transit/spark/jobs
      PYTHONPATH: /opt/transit/spark
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./spark:/opt/transit/spark
      - ./data:/data
      - airflow-home:/opt/airflow/db
    command: >
      bash -c "airflow db migrate &&
      (airflow users create --username admin --password admin --firstname Admin --lastname Transit --role Admin --email admin@example.org || true) &&
      (airflow scheduler &) && exec airflow webserver"

  # ---------------- BI ----------------
  superset:
    build: { context: ., dockerfile: docker/superset.Dockerfile }
    image: transit/superset
    ports: ["8088:8088"]
    depends_on: { clickhouse: { condition: service_healthy } }
    environment:
      SUPERSET_CONFIG_PATH: /app/bootstrap/superset_config.py
      SUPERSET_URL: http://localhost:8088
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-transit}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-transit}
    volumes:
      - ./superset:/app/bootstrap
      - superset-home:/app/superset_home
    command: ["bash", "/app/bootstrap/start.sh"]

volumes:
  minio-data:
  clickhouse-data:
  airflow-home:
  superset-home:
